on: push
name: run-tests
jobs:
  php-tests:
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        php: [8.5, 8.4, 8.3, 8.2, 8.1, 8.0, 7.4, 7.3, 7.2]
        laravel: [13.*, 12.*, 11.*, 10.*, 9.*, 8.*, 7.*, 6.*, 5.8.*, 5.7.*, 5.6.*, 5.5.*]

        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*
          - laravel: 11.*
            testbench: 9.*
          - laravel: 10.*
            testbench: 8.*
          - laravel: 9.*
            testbench: 7.*
          - laravel: 8.*
            testbench: 6.*
          - laravel: 7.*
            testbench: 5.*
          - laravel: 6.*
            testbench: 4.*
          - laravel: 5.8.*
            testbench: 3.8.*
          - laravel: 5.7.*
            testbench: 3.7.*
          - laravel: 5.6.*
            testbench: 3.6.*
          - laravel: 5.5.*
            testbench: 3.5.*

        exclude:
          - php: 7.2
            laravel: 13.*
          - php: 7.3
            laravel: 13.*
          - php: 7.4
            laravel: 13.*
          - php: 8.0
            laravel: 13.*
          - php: 8.1
            laravel: 13.*
          - php: 8.2
            laravel: 13.*
          - php: 8.5
            laravel: 9.*
          - php: 8.4
            laravel: 9.*
          - php: 8.5
            laravel: 8.*
