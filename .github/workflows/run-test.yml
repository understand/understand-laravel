            laravel: 5.6.*
          - php: 8.2
            laravel: 5.6.*
          - php: 8.1
            laravel: 5.6.*
          - php: 8.0
            laravel: 5.6.*
          - php: 8.3
            laravel: 5.5.*
          - php: 8.2
            laravel: 5.5.*
          - php: 8.1
            laravel: 5.5.*
          - php: 8.0
            laravel: 5.5.*
          - php: 7.4
            laravel: 5.5.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - T${{ matrix.testbench }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none

      - name: Install dependencies
        run: |
          # The matrix intentionally tests EOL Laravel versions that have known
          # security advisories. Allow installing them in CI only; this config is
          # never applied to projects that install this package.
          composer config audit.block-insecure false || true
          composer config policy.advisories.block false || true
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit