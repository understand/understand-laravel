          - php: 8.2
            laravel: 5.8.*
          - php: 8.1
            laravel: 5.8.*
          - php: 8.0
            laravel: 5.8.*
          - php: 8.3
            laravel: 5.7.*
          - php: 8.2
            laravel: 5.7.*
          - php: 8.1
            laravel: 5.7.*
          - php: 8.0
            laravel: 5.7.*
