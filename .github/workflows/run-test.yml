            laravel: 8.*
          - php: 8.5
            laravel: 7.*
          - php: 8.4
            laravel: 7.*
          - php: 8.5
            laravel: 6.*
          - php: 8.4
            laravel: 6.*
          - php: 8.5
            laravel: 5.8.*
          - php: 8.4
            laravel: 5.8.*
          - php: 8.5
            laravel: 5.7.*
          - php: 8.4
            laravel: 5.7.*
          - php: 8.5
            laravel: 5.6.*
          - php: 8.4
            laravel: 5.6.*
          - php: 8.5
            laravel: 5.5.*
          - php: 8.4
            laravel: 5.5.*
          - php: 7.2
            laravel: 12.*
          - php: 7.3
            laravel: 12.*
          - php: 7.4
            laravel: 12.*
          - php: 8.0
            laravel: 12.*
          - php: 8.1
            laravel: 12.*
          - php: 7.2
            laravel: 11.*
          - php: 7.3
            laravel: 11.*
          - php: 7.4
            laravel: 11.*
          - php: 8.0
            laravel: 11.*
          - php: 8.1
            laravel: 11.*
          - php: 7.2
            laravel: 10.*
          - php: 7.3
            laravel: 10.*
          - php: 7.4
            laravel: 10.*
          - php: 8.0
            laravel: 10.*
          - php: 7.2
            laravel: 9.*
          - php: 7.3
            laravel: 9.*
          - php: 7.4
            laravel: 9.*
          - php: 7.2
            laravel: 8.*
          - php: 8.3
            laravel: 7.*
          - php: 8.2
            laravel: 7.*
          - php: 8.1
            laravel: 7.*
          - php: 8.3
            laravel: 6.*
          - php: 8.2
            laravel: 6.*
